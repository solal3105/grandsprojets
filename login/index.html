<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Connexion - Open Projets</title>
  <link rel="icon" type="image/png" href="/img/logos/favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/logos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/00-colors.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/login/login.css">
  <script defer src="/modules/analytics.js" data-op-space="login"></script>
</head>
<body>
  <!-- Aurores d'arrière-plan -->
  <div class="lg-bg" aria-hidden="true">
    <div class="lg-bg__aurora lg-bg__aurora--green"></div>
    <div class="lg-bg__aurora lg-bg__aurora--blue"></div>
  </div>

  <button class="lg-theme-toggle" id="theme-toggle" type="button" aria-label="Changer de thème" title="Changer de thème">
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
    <i class="fa-solid fa-sun" aria-hidden="true"></i>
  </button>

  <main class="lg-wrap">
    <!-- Carte de connexion -->
    <section class="lg-card" role="region" aria-labelledby="lg-title">
      <header class="lg-head">
        <a href="/" class="lg-head__logo" aria-label="Retour à la carte">
          <img class="lg-logo--light" src="/img/logos/classic_color-1.png" alt="Open Projets">
          <img class="lg-logo--dark" src="/img/logos/square_white-4.png" alt="Open Projets">
        </a>
        <div>
          <span class="lg-badge"><i class="fa-solid fa-lock"></i> Espace sécurisé</span>
        </div>
        <h1 id="lg-title" class="lg-head__title">Connexion à votre espace</h1>
        <p class="lg-head__subtitle">Recevez un lien de connexion par email -<br>aucun mot de passe requis.</p>
      </header>

      <div id="auth-area">
        <form id="email-form" class="lg-form" novalidate>
          <div class="lg-field">
            <label for="email-input" class="lg-label">Adresse email</label>
            <div class="lg-input-wrap">
              <i class="fa-regular fa-envelope" aria-hidden="true"></i>
              <input
                id="email-input"
                class="lg-input"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="prenom.nom@exemple.fr"
                aria-label="Adresse email"
                required
              />
            </div>
          </div>

          <button id="magic-btn" class="lg-submit" type="submit">
            <span class="lg-submit__icon"><i class="fa-regular fa-paper-plane" aria-hidden="true"></i></span>
            <span class="lg-submit__spinner"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i></span>
            <span>Recevoir un lien de connexion</span>
          </button>
        </form>

        <div id="status" class="lg-status" role="alert" aria-live="polite"></div>
      </div>

      <footer class="lg-foot">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <p><strong>Accès sur invitation uniquement.</strong> Contactez l'administrateur de votre structure pour obtenir un compte.</p>
      </footer>
    </section>

    <!-- Liens secondaires -->
    <nav class="lg-links" aria-label="Autres options">
      <a href="/" class="lg-link">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Retour à la carte
      </a>
      <span class="lg-links__dot" aria-hidden="true"></span>
      <button id="github-btn" class="lg-link" type="button">
        <i class="fa-brands fa-github" aria-hidden="true"></i> Continuer avec GitHub
      </button>
    </nav>
  </main>

  <!-- Supabase client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script>
  <script src="/modules/auth.js"></script>
  <script>
    const auth = window.AuthModule;
    const statusEl = document.getElementById('status');
    const githubBtn = document.getElementById('github-btn');
    const emailInput = document.getElementById('email-input');
    const magicBtn = document.getElementById('magic-btn');
    const emailForm = document.getElementById('email-form');

    const STATUS_ICONS = {
      info: 'fa-solid fa-circle-notch fa-spin',
      success: 'fa-solid fa-circle-check',
      error: 'fa-solid fa-circle-exclamation'
    };

    function setStatus(msg, type = 'info') {
      statusEl.className = 'lg-status';
      statusEl.textContent = '';
      if (!msg) return;
      const icon = document.createElement('i');
      icon.className = STATUS_ICONS[type] || STATUS_ICONS.info;
      icon.setAttribute('aria-hidden', 'true');
      const text = document.createElement('span');
      text.textContent = msg;
      statusEl.append(icon, text);
      statusEl.classList.add('is-visible', type);
    }

    function setLoading(loading) {
      magicBtn.classList.toggle('is-loading', loading);
    }

    async function initAuthUI() {
      try {
        const { data: { session } } = await auth.getSession();
        if (session?.user) {
          setStatus(`Connecté en tant que ${session.user.user_metadata?.user_name || session.user.email || 'utilisateur'}.`, 'success');
          githubBtn.style.display = 'none';
          emailForm.style.display = 'none';
        }
      } catch (e) {
        console.error(e);
      }
    }

    githubBtn.addEventListener('click', async () => {
      try {
        window.OPAnalytics?.capture('login_github_started');
        setStatus('Redirection vers GitHub…');
        githubBtn.disabled = true;
        const redirectUrl = window.location.origin + '/';
        const { error } = await auth.signInWithGitHub(redirectUrl);
        if (error) {
          console.error('OAuth error:', error);
          setStatus("Impossible de démarrer l'authentification GitHub.", 'error');
          githubBtn.disabled = false;
        }
      } catch (e) {
        console.error(e);
        setStatus('Erreur inattendue.', 'error');
        githubBtn.disabled = false;
      }
    });

    function isValidEmail(v){
      return typeof v === 'string' && /.+@.+\..+/.test(v);
    }

    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      let rateLimitDelay = 2000;

      try {
        const email = (emailInput?.value || '').trim();
        if (!isValidEmail(email)) {
          setStatus('Veuillez saisir un email valide.', 'error');
          emailInput?.focus();
          return;
        }

        setStatus('Envoi du lien de connexion…');
        setLoading(true);
        magicBtn.disabled = true;
        githubBtn.disabled = true;

        const redirectUrl = window.location.origin + '/login/';
        let error = null;

        if (typeof auth.signInWithMagicLink === 'function') {
          ({ error } = await auth.signInWithMagicLink(email, redirectUrl));
        } else {
          const client = auth.getClient && auth.getClient();
          if (client && client.auth && typeof client.auth.signInWithOtp === 'function') {
            ({ error } = await client.auth.signInWithOtp({
              email,
              options: {
                emailRedirectTo: redirectUrl,
                shouldCreateUser: false
              }
            }));
          } else {
            error = new Error('Méthode de magic link indisponible.');
          }
        }

        if (error) {
          console.error('Magic link error:', error);

          const errorMsg = error.message || '';

          // Un motif classé, jamais le message brut : Supabase y recopie parfois
          // l'adresse saisie, qui n'a rien à faire dans un outil de mesure.
          const reason = /not found|Signups not allowed/i.test(errorMsg) ? 'compte_inconnu'
            : /after \d+ seconds|rate limit|too many/i.test(errorMsg) ? 'trop_de_tentatives'
              : 'erreur_technique';
          window.OPAnalytics?.capture('login_link_failed', { reason });

          if (errorMsg.includes('User not found') || errorMsg.includes('not found') || errorMsg.includes('Signups not allowed')) {
            setStatus("Cet email n'est pas enregistré. Contactez l'administrateur de votre organisation pour obtenir un accès.", 'error');
          } else if (errorMsg.includes('can only request this after') || errorMsg.includes('seconds')) {
            const match = errorMsg.match(/after (\d+) seconds/);
            const seconds = match ? parseInt(match[1], 10) : 60;
            setStatus(`Veuillez patienter ${seconds} secondes avant de demander un nouveau lien.`, 'error');
            rateLimitDelay = (seconds + 1) * 1000;
          } else if (errorMsg.includes('rate limit') || errorMsg.includes('too many')) {
            setStatus('Trop de tentatives. Veuillez patienter quelques instants avant de réessayer.', 'error');
            rateLimitDelay = 60000;
          } else {
            setStatus("Échec de l'envoi du lien. Réessayez plus tard.", 'error');
          }
        } else {
          window.OPAnalytics?.capture('login_link_sent');
          setStatus('Email envoyé ! Vérifiez votre boîte de réception.', 'success');
          rateLimitDelay = 60000;
        }
      } catch (e) {
        console.error(e);
        setStatus('Erreur inattendue.', 'error');
      } finally {
        setLoading(false);
        setTimeout(() => {
          magicBtn.disabled = false;
          githubBtn.disabled = false;
        }, rateLimitDelay);
      }
    });

    auth.onAuthStateChange((_event, _session) => {
      if (_session?.user) {
        window.location.replace('/');
      }
    });

    (function handleHashError(){
      try {
        const h = window.location.hash || '';
        if (!h) return;
        const params = new URLSearchParams(h.replace(/^#/, ''));
        const err = params.get('error');
        const code = params.get('error_code');
        if (err) {
          if (code === 'otp_expired') {
            setStatus('Le lien a expiré. Veuillez redemander un nouveau lien.', 'error');
          } else {
            setStatus('Erreur de connexion : ' + (code || err), 'error');
          }
        }
      } catch(_) {}
    })();

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });

    initAuthUI();
  </script>
</body>
</html>
