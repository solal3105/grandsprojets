[build]
  command = "cd home-src && npm ci && npm run build"
  publish = "."
  edge_functions = "netlify/edge-functions"

[functions]
  directory = "netlify/functions"

# ============================================
# Edge Functions - pré-rendu SEO
# ============================================

[[edge_functions]]
  path = "/*"
  function = "domain-redirect"

[[edge_functions]]
  path = "/fiche/"
  function = "fiche-ssr"

[[edge_functions]]
  path = "/fiche/*/*/*"
  function = "fiche-ssr"

[[edge_functions]]
  path = "/home/"
  function = "home-seo"

[[edge_functions]]
  path = "/home/fonctionnalites"
  function = "home-seo"

[[edge_functions]]
  path = "/home/a-propos"
  function = "home-seo"

[[edge_functions]]
  path = "/home/contact"
  function = "home-seo"

[[edge_functions]]
  path = "/home/aide"
  function = "home-seo"

[[edge_functions]]
  path = "/home/alternative-panneaupocket"
  function = "home-seo"

[[edge_functions]]
  path = "/home/alternative-cityall-lumiplan"
  function = "home-seo"

[[edge_functions]]
  path = "/home/alternative-neocity"
  function = "home-seo"

[[edge_functions]]
  path = "/ville/*"
  function = "ville-hub"

# Prerendering pour les crawlers (Google, Bing, etc.)
# Netlify sert une version pré-rendue du SPA aux bots
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.images]
  compress = true

# ============================================
# Redirections sous-domaines → ?city=
# ============================================

# SSO Phaos - URL propre pour la fonction d'échange de token
[[redirects]]
  from   = "/api/auth/token"
  to     = "/.netlify/functions/auth-token"
  status = 200

[[redirects]]
  from = "https://lumieres.openprojets.com/*"
  to = "https://openprojets.com/:splat?city=lumieres"
  status = 301
  force = true

# Ajouter d'autres villes ici si besoin :
# [[redirects]]
#   from = "https://keolis.openprojets.com/*"
#   to = "https://openprojets.com/:splat?city=keolis"
#   status = 301
#   force = true

# ============================================
# Fonctions Netlify
# ============================================

# ============================================
# Fonctions exposées sous /api/
# ============================================

[[redirects]]
  from = "/api/ai-generate"
  to = "/.netlify/functions/ai-generate"
  status = 200
  force = true

# /sitemap.xml - routé directement par Netlify Functions v2 (config.path dans sitemap.mjs)
# /llms.txt - idem (config.path dans llms-txt.mjs)
# Pas de redirect nécessaire
