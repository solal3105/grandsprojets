[build]
  # Le site vitrine (home-src) est reconstruit et prérendu à chaque déploiement,
  # dans /home/ ; _redirects le sert à la racine.
  command = "cd home-src && npm ci && npm run build"
  publish = "."
  edge_functions = "netlify/edge-functions"

[build.environment]
  # Le prerender installe uniquement Chromium (scripts/prerender.mjs),
  # inutile de télécharger les 3 navigateurs à chaque npm ci
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"

# ============================================
# Edge Functions - pré-rendu SEO
# ============================================

[[edge_functions]]
  path = "/*"
  function = "domain-redirect"

# Les adresses courtes partagées par l'équipe commerciale (page /lien)
[[edge_functions]]
  path = "/l/*"
  function = "lien-court"

# Les anciennes adresses de la carte portées par la racine (?city=, ?cat=...)
[[edge_functions]]
  path = "/"
  function = "carte-legacy"

# Le site vitrine : données structurées et en-têtes sur les pages prérendues
[[edge_functions]]
  path = "/"
  function = "home-seo"

[[edge_functions]]
  path = "/carte"
  function = "home-seo"

[[edge_functions]]
  path = "/travaux"
  function = "home-seo"

[[edge_functions]]
  path = "/participer"
  function = "home-seo"

[[edge_functions]]
  path = "/diagnostic"
  function = "home-seo"

[[edge_functions]]
  path = "/chantiers"
  function = "home-seo"

[[edge_functions]]
  path = "/tarification"
  function = "home-seo"

[[edge_functions]]
  path = "/a-propos"
  function = "home-seo"

[[edge_functions]]
  path = "/aide"
  function = "home-seo"

[[edge_functions]]
  path = "/confidentialite"
  function = "home-seo"

[[edge_functions]]
  path = "/alternative-panneaupocket"
  function = "home-seo"

[[edge_functions]]
  path = "/alternative-cityall-lumiplan"
  function = "home-seo"

[[edge_functions]]
  path = "/alternative-neocity"
  function = "home-seo"

[[edge_functions]]
  path = "/ressources"
  function = "home-seo"

[[edge_functions]]
  path = "/ressources/*"
  function = "home-seo"

[[edge_functions]]
  path = "/fiche/"
  function = "fiche-ssr"

[[edge_functions]]
  path = "/fiche/*/*/*"
  function = "fiche-ssr"

# La carte d'une collectivité : titre, description et indexation par ville et
# par module (les trois modules publics)
[[edge_functions]]
  path = "/ville/:ville/carte"
  function = "carte-seo"

[[edge_functions]]
  path = "/ville/:ville/travaux"
  function = "carte-seo"

[[edge_functions]]
  path = "/ville/:ville/participer"
  function = "carte-seo"

[[edge_functions]]
  path = "/ville/*"
  function = "ville-hub"

[[edge_functions]]
  path = "/cartes/"
  function = "cartes"

# Prerendering pour les crawlers (Google, Bing, etc.)
# Netlify sert une version pré-rendue du SPA aux bots
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.images]
  compress = true

# ============================================
# Redirections sous-domaines → la carte de la ville
# ============================================

# Mesure d'audience PostHog : le proxy inverse /ph/* est déclaré dans
# `_redirects`, pas ici. Les règles de `_redirects` sont évaluées AVANT celles
# de ce fichier, et son catch-all `/* -> /index.html` absorberait les requêtes.

# SSO Phaos - URL propre pour la fonction d'échange de token
[[redirects]]
  from   = "/api/auth/token"
  to     = "/.netlify/functions/auth-token"
  status = 200

[[redirects]]
  from = "https://lumieres.openprojets.com/*"
  to = "https://openprojets.com/ville/lumieres/carte"
  status = 301
  force = true

# Ajouter d'autres villes ici si besoin :
# [[redirects]]
#   from = "https://keolis.openprojets.com/*"
#   to = "https://openprojets.com/ville/keolis/carte"
#   status = 301
#   force = true

# ============================================
# Fonctions Netlify
# ============================================

# ============================================
# Fonctions exposées sous /api/
# ============================================

[[redirects]]
  from = "/api/ai-generate"
  to = "/.netlify/functions/ai-generate"
  status = 200
  force = true

# /sitemap.xml - routé directement par Netlify Functions v2 (config.path dans sitemap.mjs)
# /llms.txt - idem (config.path dans llms-txt.mjs)
# Pas de redirect nécessaire

# ============================================
# Écran de démo salon : jamais de feuille de style périmée
# ============================================
# Par défaut, les fichiers statiques sont servis avec max-age=86400 et
# stale-while-revalidate=604800 : une correction de style met jusqu'à 24 h à
# atteindre un navigateur, et jusqu'à 7 jours s'il se contente du périmé.
# Sur un écran de salon déjà venu sur le site, cela garantit un affichage cassé
# le jour J. Le trafic de cette page est négligeable, la fraîcheur prime.
[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# La fabrique de liens est une page d'équipe. Le routeur pose déjà sa balise
# noindex, mais elle n'existe qu'une fois le JavaScript exécuté : l'en-tête la
# met hors des moteurs dès la première réponse, y compris pour les robots qui
# ne rendent pas les pages.
[[headers]]
  for = "/lien"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Même règle pour la page des cartes, qui tourne sur le même écran de salon
[[headers]]
  for = "/cartes/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# La page de la vidéo des salons (/video) est hors des moteurs, comme la
# fabrique de liens. La règle vise la page seule : les fichiers sous /video/
# gardent les en-têtes ci-dessous, la vidéo de présentation reste indexable.
[[headers]]
  for = "/video"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# La vidéo de présentation et son affiche ne changent qu'avec un nouveau
# montage : elles se gardent longtemps, et le navigateur peut en demander
# un morceau à la fois (lecture avant la fin du téléchargement).
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    Accept-Ranges = "bytes"

# ============================================
# Le code de l'application doit revalider
# ============================================
# Hors du home, aucun fichier JS/CSS n'a de nom versionné : `main.js` reste
# `main.js` d'un déploiement à l'autre. Avec le cache par défaut
# (max-age=86400 + stale-while-revalidate=604800), un visiteur déjà venu
# continue d'exécuter l'ANCIEN code pendant 24 h, et jusqu'à 7 jours s'il se
# contente du périmé - alors que `index.html`, lui, revalide à chaque fois.
# Un nouveau module se retrouve donc annoncé par un HTML à jour mais servi par
# des scripts périmés : bouton présent, fonctionnalité absente. C'est
# exactement ce qui s'est produit à la mise en ligne du module Participer.
#
# `must-revalidate` ne retélécharge rien : le navigateur envoie une requête
# conditionnelle et reçoit un 304 vide tant que le fichier n'a pas changé.
#
# Le home est exclu : son build Vite produit des noms hachés
# (`index-VQTl2WDf.js`), qui peuvent et doivent rester en cache longtemps.
[[headers]]
  for = "/main.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/modules/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fiche/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/login/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/carte-postale/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ville/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
