[build]
  command = "cd home && npm ci && npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"

# Prerendering pour les crawlers (Google, Bing, etc.)
# Netlify sert une version pré-rendue du SPA aux bots
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ============================================
# Redirections domaines alternatifs → openprojets.com
# IMPORTANT: Ces redirections ne fonctionnent QUE si les domaines
# sont configurés dans Netlify (Domain Management)
# ============================================

# Redirection grandsprojets.com → openprojets.com (HTTP)
[[redirects]]
  from = "http://grandsprojets.com/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

# Redirection grandsprojets.com → openprojets.com (HTTPS)
[[redirects]]
  from = "https://grandsprojets.com/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

# Redirection www.grandsprojets.com → openprojets.com (HTTP)
[[redirects]]
  from = "http://www.grandsprojets.com/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

# Redirection www.grandsprojets.com → openprojets.com (HTTPS)
[[redirects]]
  from = "https://www.grandsprojets.com/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

# Autres domaines alternatifs (si configurés dans Netlify)
[[redirects]]
  from = "http://openprojet.com/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://openprojet.com/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://openprojets.fr/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://openprojets.fr/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://openprojet.fr/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://openprojet.fr/*"
  to = "https://openprojets.com/:splat"
  status = 301
  force = true

# ============================================
# Redirections sous-domaines → ?city=
# ============================================

[[redirects]]
  from = "https://lumieres.openprojets.com/*"
  to = "https://openprojets.com/:splat?city=lumieres"
  status = 301
  force = true

# Ajouter d'autres villes ici si besoin :
# [[redirects]]
#   from = "https://keolis.grandsprojets.com/*"
#   to = "https://grandsprojets.com/:splat?city=keolis"
#   status = 301
#   force = true

# ============================================
# Fonctions Netlify
# ============================================

# Force the dynamic function over any static file with the same path
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true
